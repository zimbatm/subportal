[workspace]
resolver = "2"
members = [
    "crates/subportal-lib",
    "crates/subportal-iroh",
    "crates/subportal-desktop",
    "crates/subportal",
    "crates/subportal-android-core",
    "crates/uniffi-bindgen",
    "crates/xdg-open",
    "crates/notify-send",
]

[workspace.package]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "fs", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ashpd = "0.11"
url = "2"
mime_guess = "2"
libc = "0.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
iroh = "0.96"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
subportal-lib = { path = "crates/subportal-lib" }
subportal-iroh = { path = "crates/subportal-iroh" }
