[workspace]
resolver = "2"
members = [
    "crates/subportal-lib",
    "crates/subportald",
    "crates/subportal",
    "crates/xdg-open",
    "crates/notify-send",
]

[workspace.package]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "fs", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ashpd = "0.11"
url = "2"
mime_guess = "2"
libc = "0.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
subportal-lib = { path = "crates/subportal-lib" }
